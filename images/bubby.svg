  <title id="pegasus-title">Approved Pegasus, layered vector</title>
  <desc id="pegasus-description">Front-facing Pegasus with spread gold wings. Hand-drafted flat cubic shapes, sampled from the approved cutout. Coordinates and pivots are in the 1024-unit artboard; left and right mean viewer left and right. Joint cover is at least 12 units. The tail is occluded in the approved rest pose. Eye lids start outside their eye clips. Nose retains the reference warm peach rather than introducing a new pink.</desc>
